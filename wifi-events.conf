# Records each Wi-Fi login attempt for the portal's connection history. Used from the PEAP inner
# tunnel (sites-available/inner-tunnel), where User-Name is the real, checked username.
# One line per attempt:   <unix time> TAB <accept|reject> TAB <username> TAB <device MAC>
# %{escape:...} turns tabs, line breaks and other unsafe characters into =XX, so a crafted
# username can't add fields or fake extra lines.
linelog wifi_event_accept {
	filename = /var/log/wifi-events/auth.log
	permissions = 0644
	format = "%l\taccept\t%{escape:%{User-Name}}\t%{escape:%{outer.request:Calling-Station-Id}}"
}

linelog wifi_event_reject {
	filename = /var/log/wifi-events/auth.log
	permissions = 0644
	format = "%l\treject\t%{escape:%{User-Name}}\t%{escape:%{outer.request:Calling-Station-Id}}"
}
