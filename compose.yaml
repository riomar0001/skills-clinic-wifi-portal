services:
  # FreeRADIUS: checks Wi-Fi logins for the router and records each attempt.
  radius:
    build: .
    image: wifi-radius
    container_name: wifi-radius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
    volumes:
      - ./data:/mnt/local:ro
      - radius-events:/var/log/wifi-events

  # Portal (FastAPI + React) for admins and Wi-Fi users, one sign-in page.
  # Writes data/users (the radius container reloads it) and reads the login history.
  portal:
    build: ./portal
    image: wifi-portal
    container_name: wifi-portal
    restart: unless-stopped
    depends_on:
      - radius
    # No published port: only the proxy below reaches it. The portal trusts the proxy's
    # X-Forwarded-For/-Proto headers, so never publish 8080 directly.
    environment:
      RADIUS_HOST: radius
    volumes:
      - ./data:/mnt/radius
      - radius-events:/mnt/radius-events:ro
      # SQLite lives in a Docker volume: file locking on Windows folder mounts isn't reliable.
      - portal-db:/var/lib/portal

  # Front door for the portal, open to the network so Wi-Fi users reach it; admins use the same page.
  # HTTPS with the Let's Encrypt certificate when there is one (port 80 redirects), else plain HTTP on 80.
  proxy:
    build: ./proxy
    image: wifi-proxy
    container_name: wifi-proxy
    restart: unless-stopped
    depends_on:
      - portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/letsencrypt:/mnt/letsencrypt:ro

  # Optional publicly trusted certificate (Let's Encrypt via Cloudflare DNS). Waits, doing nothing,
  # until letsencrypt/cloudflare.ini and letsencrypt/domain exist. See docs/SETUP.md.
  certs:
    build: ./certs
    image: wifi-certs
    container_name: wifi-certs
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/wifi-certs:ro  # API token: only this container sees it
      - ./data/letsencrypt:/out
      - letsencrypt-state:/etc/letsencrypt

  # Optional Cloudflare Tunnel: the portal is reached through Cloudflare, which shows the fallback page
  # (fallback/) while this server is down. Setup starts it only when tunnel/token exists. See docs/SETUP.md.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    container_name: wifi-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    depends_on:
      - proxy
    # Goes to the proxy's internal port 8081, never straight to the portal (see proxy/start.sh).
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token

secrets:
  tunnel_token:
    file: ./tunnel/token

volumes:
  portal-db:
  radius-events:
  letsencrypt-state:
