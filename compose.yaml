services:
  # FreeRADIUS: checks Wi-Fi logins for the router and records each attempt.
  radius:
    build: .
    image: wifi-radius
    container_name: wifi-radius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
    volumes:
      - ./data:/mnt/local:ro
      - radius-events:/var/log/wifi-events

  # Portal (FastAPI + React) for admins and Wi-Fi users, one sign-in page.
  # Writes data/users (the radius container reloads it) and reads the login history.
  portal:
    build: ./portal
    image: wifi-portal
    container_name: wifi-portal
    restart: unless-stopped
    depends_on:
      - radius
    ports:
      # Open to the network so Wi-Fi users can reach their portal; admins sign in on the same page.
      - "80:8080"  # this PC's port 80 (plain http://<server>) to the portal's 8080 inside
    environment:
      RADIUS_HOST: radius
    volumes:
      - ./data:/mnt/radius
      - radius-events:/mnt/radius-events:ro
      # SQLite lives in a Docker volume: file locking on Windows folder mounts isn't reliable.
      - portal-db:/var/lib/portal

  # Optional publicly trusted certificate (Let's Encrypt via Cloudflare DNS). Waits, doing nothing,
  # until letsencrypt/cloudflare.ini and letsencrypt/domain exist. See docs/SETUP.md.
  certs:
    build: ./certs
    image: wifi-certs
    container_name: wifi-certs
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/wifi-certs:ro  # API token: only this container sees it
      - ./data/letsencrypt:/out
      - letsencrypt-state:/etc/letsencrypt

volumes:
  portal-db:
  radius-events:
  letsencrypt-state:
